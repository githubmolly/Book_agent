[project]
name = "book-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.112.0",
    "fastapi>=0.139.2",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.17",
    "langchain-anthropic>=1.4.8",
    "langchain-mcp-adapters>=0.1,<0.2",
    "langgraph>=1.2.8",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp[cli]>=1.28,<2",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
